spring.application.name=visionstock-api-test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate - auto-create schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 does not support PostgreSQL schemas natively, use default schema
spring.jpa.properties.hibernate.default_schema=PUBLIC

# Google Gemini AI Configuration (test values)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# JWT Security (test values)
security.jwt.secret-key=test-secret-key-with-at-least-32-characters-visionstock
security.jwt.expiration-ms=86400000
