spring.application.name=visionstock-api
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:8080}

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/visionstock}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Default schema
spring.jpa.properties.hibernate.default_schema=public

# Google Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-2.5-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Security
security.jwt.secret-key=${JWT_SECRET_KEY:visionstock-super-secret-key-change-this-in-production-2026}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional: bootstrap ADMIN user on startup (dev/local profile only)
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:false}
app.seed.admin.nome=${SEED_ADMIN_NOME:Admin Mestre}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
